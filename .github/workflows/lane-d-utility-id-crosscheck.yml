name: Lane D - Official EIA and ORNL utility ID concordance

on:
  push:
    branches:
      - ingest/eia861-utility-bi-lane-d-20261023
    paths:
      - facilityrisk/lane_d/audit_native_eia_ids.py
      - tests/test_lane_d_audit_native_eia_ids.py
      - .github/workflows/lane-d-utility-id-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-native-utility-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate no fuzzy utility names or automatic insured-site matches
        run: python -m unittest discover -s tests -p test_lane_d_audit_native_eia_ids.py -v
      - name: Install workbook parser
        run: python -m pip install openpyxl
      - name: Download authentic 2025 EIA source ZIP for native IDs
        shell: bash
        run: |
          mkdir -p /tmp/lane-d/identity
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 240 \
            --user-agent 'FacilityRiskLaneD/1.0 official source identity crosscheck' \
            https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip \
            --output /tmp/lane-d/identity/f8612025.zip
      - name: Stage the real official EIA-861 source identity indexes
        run: |
          python -m facilityrisk.lane_d.ingest_eia861 \
            --year 2025 --zip /tmp/lane-d/identity/f8612025.zip \
            --output /tmp/lane-d/identity/eia
      - name: Download one genuine current ORNL public ODIN source snapshot
        run: |
          python -m facilityrisk.lane_d.ingest_odin_direct \
            --output /tmp/lane-d/identity/odin
      - name: Join only the original EIA-native utility reporting IDs, not sites
        run: |
          python -m facilityrisk.lane_d.audit_native_eia_ids \
            --eia-db /tmp/lane-d/identity/eia/lane_d_eia861_staging.sqlite \
            --odin-db /tmp/lane-d/identity/odin/odin_direct_county_staging.sqlite \
            --output /tmp/lane-d/identity/native_eia_identity_audit.json
      - name: Reconcile exact source origins and report source-only link status
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sqlite3
          p=pathlib.Path("/tmp/lane-d/identity")
          eia=json.loads((p/"eia"/"manifest.json").read_text())
          odin=json.loads((p/"odin"/"manifest.json").read_text())
          links=json.loads((p/"native_eia_identity_audit.json").read_text())
          assert eia["accepted"]==12923 and eia["rejected"]==3
          assert links["eia_source_kind_rows"]==eia["accepted_by_source_kind"]
          assert links["odin_public_county_status_rows"]==odin["normalized_accepted"]
          assert links["odin_distinct_source_native_eia_utility_ids"]==odin["observations"]["distinct_source_eia_utility_ids"]
          assert links["native_id_matches"]>0, "No exact genuine EIA native utility identifiers linked"
          assert links["native_id_matches"]<=links["odin_distinct_source_native_eia_utility_ids"]
          assert sum(links["publisher_native_id_link_status"].values())==links["odin_distinct_source_native_eia_utility_ids"]
          assert all(not x["verified_insured_site_serving_utility"] and not x["verified_insured_site_power_outage"] for x in links["links"])
          assert links["verified_physical_facility_power_provider_assignments"]==0
          assert links["durable_backend_links_indexed"]==0 and links["deployed"]==0
          safe={key:value for key,value in links.items() if key!="links"}
          safe.update({
            "eia_original_zip_sha256":eia["archive_sha256"],
            "odin_direct_http_json_sha256":odin["original_raw_json_sha256"],
            "staging_eia_source_rows":eia["accepted"],
            "staging_odin_source_rows":odin["normalized_accepted"],
            "source_connection_not_insured_site":True,
          })
          (p/"safe_utility_id_crosscheck.json").write_text(json.dumps(safe,indent=2)+"\n")
          print("EIA/ODIN source-native utility concordance:",json.dumps(safe,indent=2))
          PY
      - name: Upload actual count and source signature, no raw outage source redistribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-eia-odin-native-utility-id-link-qa
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/lane-d/identity/safe_utility_id_crosscheck.json
