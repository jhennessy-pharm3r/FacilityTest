name: Lane B EPA public FRS-RMP complete indexed-source verification
on:
  push:
    branches: ['ingest/epa-echo-tri-rcra-rmp-lane-b-20261023']
    paths: ['.github/workflows/lane-b-rmp-public.yml']
  workflow_dispatch:
jobs:
  public-frs-rmp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import complete public EPA FRS RMP program-interest layer
        run: |
          set -euo pipefail
          python -m scripts.lane_b_epa.rmp_public --output "$RUNNER_TEMP/rmp_frs_public" > "$RUNNER_TEMP/rmp_stdout.json"
          cat "$RUNNER_TEMP/rmp_stdout.json"
      - name: Verify exact official source census and local read-only program lookup
        run: |
          python - <<'PY'
          import json,os,pathlib,sqlite3,hashlib
          from scripts.lane_b_epa.rmp_lookup import status,lookup
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rmp_frs_public'
          m=json.loads((out/'rmp_frs_public.manifest.json').read_text())
          assert m['reported_feature_count']>0
          assert m['reported_feature_count']==m['indexed_rows']==m['object_id_coverage']
          assert m['sqlite_integrity']=='ok' and m['schema_version']==2
          assert m['deployment_state']=='NOT_DEPLOYED'
          assert m['distinct_program_ids']>0 and m['distinct_registry_ids']>0
          with sqlite3.connect(out/'rmp_frs_public.sqlite') as con:
              program=con.execute("SELECT program_id FROM rmp_frs_public LIMIT 1").fetchone()[0]
          facts=status(out)
          result=lookup(out,program,limit=5)
          assert facts['records']==m['indexed_rows']
          assert result['observations_available']>0 and result['records'][0]['raw_sha256']
          print('PUBLIC_RMP_CENSUS',m['indexed_rows'],
                'NATIVE_PROGRAM_IDS',m['distinct_program_ids'],
                'NATIVE_REGISTRY_IDS',m['distinct_registry_ids'],
                'COORDINATE_PAIRS',m['valid_coordinate_pairs'],
                'SAMPLE_ID_HASH',hashlib.sha256(program.encode()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-public-frs-rmp-manifest
          path: ${{ runner.temp }}/rmp_frs_public/*.manifest.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lane-b-public-frs-rmp-source-only-index
          path: |
            ${{ runner.temp }}/rmp_frs_public/*.sqlite
            ${{ runner.temp }}/rmp_frs_public/*.raw.jsonl
            ${{ runner.temp }}/rmp_frs_public/*.manifest.json
          if-no-files-found: error
          retention-days: 7
