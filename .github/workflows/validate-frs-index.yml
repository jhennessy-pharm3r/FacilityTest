name: Validate full EPA FRS indexed database
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful official EPA staging workflow run ID (required)'
        required: true
        type: string
  workflow_run:
    workflows: ['EPA FRS national source staging']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: full-frs-index-build
  cancel-in-progress: false
jobs:
  index:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FACILITY_RISK_DB: data/full-frs-index.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies for database initialization
        run: python -m pip install -r requirements.txt
      - name: Validate benchmark CLI import path before building 5M records
        run: python scripts/benchmark_frs_search.py --help > /dev/null
      - name: Download completed full official EPA FRS source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: epa-frs-national-source-import
          path: data
      - name: Verify original source manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/epa-frs-national-manifest.json'))
          assert m['complete_source'], 'Staged source is partial'
          assert m['valid_records']>=5000000, 'National source dropped below the minimum quality floor'
          assert m['valid_records']+m['rejected_rows']==m['read_rows'], 'Manifest has inconsistent rows'
          assert len(m['sha256'])==64 and len(m['output_sha256'])==64
          print('Official source cohort verified:',m['valid_records'])
          print('Change from October 2026 reference:',m['valid_records']-5354716)
          print('Rejected raw source rows:',m['rejected_rows'])
          PY
      - name: Load all source identities into indexed SQLite
        id: full_index
        run: |
          python -u - <<'PY'
          import json,sqlite3,time
          from facilityrisk.db import connect,initialize
          from facilityrisk.universal_registry import import_records,search,statistics
          from scripts.import_universal import csv_rows
          from facilityrisk.registry_catalog import FIELDS
          started=time.monotonic()
          manifest=json.load(open('data/epa-frs-national-manifest.json'))
          c=connect()
          initialize(c)
          # This database is a disposable, rebuildable source-only validation
          # artifact, NOT a production database with insured/client information.
          c.execute('PRAGMA journal_mode=OFF')
          c.execute('PRAGMA synchronous=OFF')
          c.execute('PRAGMA cache_size=-131072')
          columns=('source_identifier','name','company','address','city','state',
                    'country','industry','category','activities','latitude',
                    'longitude','source_confidence')
          mapping={k:k for k in columns}
          source='https://www.epa.gov/frs/epa-frs-facilities-state-single-file-csv-download'
          result=import_records(c,'EPA_FRS',
             csv_rows('data/epa-frs-national.csv.gz',mapping),
             source,vintage=manifest['generated_at'][:10],
             notes='Complete EPA national source identity import; not verified properties')
          stats=statistics(c)
          assert result['read']>=5000000, result
          assert result['rejected']==0, result
          assert stats['source_identities']>=5000000, stats
          assert stats['site_candidates']>=5000000, stats
          first=search(c,q='warehouse',limit=2)
          assert first['total']>=1,'FTS index did not find warehouses'
          index_ok=c.execute('PRAGMA quick_check').fetchone()[0]
          assert index_ok=='ok',index_ok
          c.execute('PRAGMA wal_checkpoint(TRUNCATE)') if c.execute('PRAGMA journal_mode').fetchone()[0]=='wal' else None
          import os
          report={'source_record_count':result['read'],
                  'unique_source_identifiers':stats['source_identities'],
                  'site_candidates':stats['site_candidates'],
                  'warehouse_search_matches':first['total'],
                  'sqlite_quick_check':index_ok,
                  'source_vintage':manifest['generated_at'],
                  'source_archive_sha256':manifest['sha256'],
                  'normalized_source_sha256':manifest['output_sha256'],
                  'database_bytes':os.stat('data/full-frs-index.sqlite').st_size,
                  'elapsed_seconds':round(time.monotonic()-started,2),
                  'property_verified_count':0,
                  'insurance_coverage_verified_count':0,
                  'source':'EPA FRS public reporting identities'}
          with open('data/full-frs-index-qa.json','w') as f:
              json.dump(report,f,indent=2)
          print(json.dumps(report,indent=2),flush=True)
          c.close()
          PY
      - name: Benchmark indexed all-industry search and parallel read performance
        run: |
          python scripts/benchmark_frs_search.py data/full-frs-index.sqlite \
            --out data/frs-search-benchmark.json --repeats 3 --concurrency 4
      - name: Publish validated source-only SQLite for private-host import
        if: ${{ always() && steps.full_index.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: epa-frs-indexed-registry
          path: |
            data/full-frs-index.sqlite
            data/full-frs-index-qa.json
            data/frs-search-benchmark.json
          compression-level: 3
          retention-days: 7
          if-no-files-found: error
