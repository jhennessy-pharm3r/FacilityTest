name: Lane D - Official public-domain DOE OE417 annual event ingestion

on:
  push:
    branches:
      - ingest/eia861-utility-bi-lane-d-20261023
    paths:
      - facilityrisk/lane_d/install_source_index.py
      - tests/test_lane_d_install_source_index.py
      - facilityrisk/lane_d/ingest_oe417_annual.py
      - facilityrisk/lane_d/query_oe417_annual.py
      - tests/test_lane_d_query_oe417_annual.py
      - tests/test_lane_d_oe417_annual.py
      - .github/workflows/lane-d-oe417-annual-ingestion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-doe-oe417-2023-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run public-license, original-ID absence, duplicate and reject regression
        run: |
          python -m unittest discover -s tests -p test_lane_d_oe417_annual.py -v
          python -m unittest discover -s tests -p test_lane_d_query_oe417_annual.py -v
      - name: Download ORIGINAL public-domain DOE CESER 2023 annual source distribution
        run: |
          python -m facilityrisk.lane_d.ingest_oe417_annual \
            --output /tmp/lane-d/oe417-2023
      - name: Independently verify original JSON export, metadata license and every SQLite staged row
        shell: bash
        run: |
          python - <<'PY'
          import collections,hashlib,json,pathlib,sqlite3
          root=pathlib.Path("/tmp/lane-d/oe417-2023")
          m=json.loads((root/"manifest.json").read_text())
          source=(root/"original_export.json").read_bytes()
          metadata=(root/"original_metadata.json").read_bytes()
          orig=json.loads(source)
          meta=json.loads(metadata)
          accepted=[json.loads(x) for x in (root/"accepted.jsonl").read_text().splitlines()]
          rejected=[json.loads(x) for x in (root/"rejected.jsonl").read_text().splitlines()]
          assert m["downloaded_official_original_json"]
          assert meta["dataset_id"]=="oe-417-annual-summaries"
          assert m["metadata_declared_license"]=="Public Domain"
          assert m["metadata_original_sha256"]==hashlib.sha256(metadata).hexdigest()
          assert m["downloaded_original_export_sha256"]==hashlib.sha256(source).hexdigest()
          assert m["downloaded_original_export_bytes"]==len(source)
          assert len(orig)==m["original_source_rows"]==len(accepted)+len(rejected)
          assert len(orig)>=100, "Unexpectedly small public source, verify publisher scope"
          assert len(accepted)==m["normalized_accepted"]==m["indexed_temporary_sqlite_rows"]
          assert m["rejected"]==len(rejected)
          assert sum(m["statistics"]["rejection_reasons"].values())==len(rejected)
          for r in accepted:
              original=orig[r["source_original_position_1based"]-1]
              assert original==r["original_source_row"]
              assert hashlib.sha256(json.dumps(original,sort_keys=True,ensure_ascii=False,separators=(",",":")).encode()).hexdigest()==r["original_row_sha256"]
              assert r["publisher_native_event_id"] is None
              assert not r["site_electric_outage_verified"]
              assert not r["insured_business_interruption_claim_confirmed"]
          with sqlite3.connect(root/"oe417_annual_staging.sqlite") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM source_observations").fetchone()[0]==len(accepted)
              assert db.execute("SELECT COUNT(*) FROM source_observations WHERE exact_duplicate_source=1").fetchone()[0]==m["statistics"]["exact_duplicate_source_rows"]
              assert {x[0] for x in db.execute("SELECT source_row_key FROM source_observations")}=={r["source_row_key"] for r in accepted}
          assert m["durable_backend_indexed"]==m["deployed"]==0
          print("REAL OFFICIAL DOE OE-417 PUBLIC DOMAIN SOURCE validated:",
                len(orig),"downloaded",len(accepted),"normalized/indexed",
                len(rejected),"rejected","years",m["statistics"]["source_calendar_year_counts"],
                "source duplicated rows",m["statistics"]["exact_duplicate_source_rows"],
                "license",m["metadata_declared_license"])
          PY
      - name: Repeat exact normalized source transform from downloaded bytes for reproducibility
        shell: bash
        run: |
          python -m facilityrisk.lane_d.ingest_oe417_annual \
            --source-json /tmp/lane-d/oe417-2023/original_export.json \
            --metadata-json /tmp/lane-d/oe417-2023/original_metadata.json \
            --output /tmp/lane-d/oe417-repeat
          python - <<'PY'
          import hashlib,pathlib
          a=pathlib.Path("/tmp/lane-d/oe417-2023")
          b=pathlib.Path("/tmp/lane-d/oe417-repeat")
          for filename in ("accepted.jsonl","rejected.jsonl","oe417_annual_staging.sqlite"):
              left=hashlib.sha256((a/filename).read_bytes()).hexdigest()
              right=hashlib.sha256((b/filename).read_bytes()).hexdigest()
              assert left==right,"Nonreproducible normalized source file "+filename
              print("REPRODUCIBLE DOE OE417",filename,left)
          PY
      - name: Validate source-only annual event type and undated source-row query on ORIGINAL 2023 index
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,json
          from facilityrisk.lane_d.query_oe417_annual import annual_context
          root=pathlib.Path("/tmp/lane-d/oe417-2023")
          db=root/"oe417_annual_staging.sqlite"
          m=json.loads((root/"manifest.json").read_text())
          allrows=annual_context(db,limit=100)
          dated=annual_context(db,event_year=2023,limit=100)
          missing=annual_context(db,date_state="undated",limit=100)
          vandalism=annual_context(db,event_type="Vandalism",limit=100)
          expected=m["statistics"]
          assert allrows["original_source_rows_total"]==m["original_source_rows"]
          assert allrows["matching_content_distinct_source_rows"]==expected["content_distinct_accepted_publisher_rows"]
          assert allrows["exact_duplicate_original_rows_withheld"]==expected["exact_duplicate_source_rows"]
          assert missing["matching_content_distinct_source_rows"]==expected["missing_event_start_date_preserved_as_unknown"]
          assert dated["matching_content_distinct_source_rows"]==expected["source_calendar_year_counts"]["2023"]
          assert vandalism["matching_content_distinct_source_rows"]==expected["source_event_type_counts"]["Vandalism"]
          assert all(r["date_status"]=="NOT_REPORTED" for r in missing["source_records"])
          assert all(r["publisher_native_event_id"] is None for r in allrows["source_records"])
          assert all(r["insured_site_electric_outage_verified"] is False for r in allrows["source_records"])
          assert allrows["independently_confirmed_insurer_paid_business_interruption_claims"]==0
          print("ACTUAL OE417 READONLY SOURCE QUERY dated",dated["matching_content_distinct_source_rows"],
                "undated",missing["matching_content_distinct_source_rows"],
                "Vandalism",vandalism["matching_content_distinct_source_rows"],
                "verified site events",0)
          PY
      - name: Prepare original-source-pinned DOE OE417 readonly SQLite handoff
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,sqlite3
          root=pathlib.Path("/tmp/lane-d/oe417-2023")
          source=(root/"original_export.json").read_bytes()
          meta=json.loads((root/"original_metadata.json").read_text())
          m=json.loads((root/"manifest.json").read_text())
          idx=root/"oe417_annual_staging.sqlite"
          with sqlite3.connect(idx) as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM source_observations").fetchone()[0]==m["normalized_accepted"]
          assert m["downloaded_official_original_json"] is True
          assert m["metadata_declared_license"]=="Public Domain"
          assert hashlib.sha256(source).hexdigest()==m["downloaded_original_export_sha256"]
          receipt={
              "source_dataset":"oe417_annual_public",
              "original_json_sha256":hashlib.sha256(source).hexdigest(),
              "staged_sqlite_sha256":hashlib.sha256(idx.read_bytes()).hexdigest(),
              "staged_sqlite_bytes":idx.stat().st_size,
              "indexed_source_rows":m["normalized_accepted"],
              "publisher_declared_license":"Public Domain",
              "deployed":0,
          }
          (root/"coordinator_handoff.json").write_text(json.dumps(receipt,indent=2)+"\n")
          PY
      - name: Package published public-domain OE417 source-only index
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-oe417-2023-public-domain-readonly-staging-index
          retention-days: 3
          if-no-files-found: error
          path: |
            /tmp/lane-d/oe417-2023/oe417_annual_staging.sqlite
            /tmp/lane-d/oe417-2023/coordinator_handoff.json
            /tmp/lane-d/oe417-2023/manifest.json
      - name: Recover original publisher OE417 dataset handoff independently
        uses: actions/download-artifact@v4
        with:
          name: lane-d-oe417-2023-public-domain-readonly-staging-index
          path: /tmp/lane-d-oe417-transferred
      - name: Install pinned public-domain DOE OE417 source index and query event context
        shell: bash
        run: |
          HASH=$(sha256sum /tmp/lane-d/oe417-2023/original_export.json | cut -d' ' -f1)
          python -m facilityrisk.lane_d.install_source_index install --bundle /tmp/lane-d-oe417-transferred --dest /tmp/lane-d-oe417-private-install-smoke --dataset oe417_annual_public --source-sha256 "$HASH"
          python -m facilityrisk.lane_d.install_source_index verify --dest /tmp/lane-d-oe417-private-install-smoke --dataset oe417_annual_public
          python -m facilityrisk.lane_d.install_source_index query --dest /tmp/lane-d-oe417-private-install-smoke --dataset oe417_annual_public --year 2023 --limit 5
      - name: Save OE417 source-only install acceptance pointer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-oe417-install-smoke
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/lane-d-oe417-private-install-smoke/oe417_annual_public/current.json
      - name: Upload source-only published SHA provenance and original row/duplicate QA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-doe-oe417-2023-annual-source-qa
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/lane-d/oe417-2023/manifest.json
