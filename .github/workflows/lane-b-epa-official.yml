name: Lane B EPA official archive validation
on:
  push:
    branches:
      - 'ingest/epa-echo-tri-rcra-rmp-lane-b-20261023'
    paths:
      - '.github/workflows/lane-b-epa-official.yml'
  workflow_dispatch:
jobs:
  official-epa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        source: [rcra, echo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full official EPA source-only archive importer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lane_b/$L"
          python -m scripts.lane_b_epa.ingest --source "$L" --output "$RUNNER_TEMP/lane_b/$L" > "$RUNNER_TEMP/lane_b/$L/output.json"
        env:
          L: ${{ matrix.source }}
      - name: Check content-level reconciliation
        run: |
          python -c 'import json,glob; m=json.load(open(glob.glob("/home/runner/work/_temp/lane_b/*/*.manifest.json")[0])); assert m["accepted_rows"]>0 and m["integrity"]=="ok" and m["accepted_rows"]==m["indexed_rows"]; print(m)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-${{ matrix.source }}-validation
          path: ${{ runner.temp }}/lane_b/${{ matrix.source }}/*.manifest.json
          if-no-files-found: warn
          retention-days: 7
