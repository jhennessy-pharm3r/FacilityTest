name: FDA facility registry update
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/build_catalog.py'
      - 'scripts/build_ireland_leap.py'
      - 'facilityrisk/registry_catalog.py'
      - '.github/workflows/build-registry.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared catalog dependencies and bounded streaming parser
        run: python -m pip install -r requirements.txt 'ijson>=3.3,<4'
      - name: Refresh all available FDA registration/listing partitions
        run: python scripts/build_catalog.py --output web/registry/catalog.json
      - name: Inspect public drug-address geography patterns without private contacts
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from facilityrisk.registry_catalog import COUNTRY_NAMES,country_from_explicit_address
          data=json.load(open('web/registry/catalog.json',encoding='utf-8'))
          keys=data['fields']
          records=[dict(zip(keys,row)) for row in data['rows']
                   if row[keys.index('sector')]=='Pharmaceutical']
          sample=records[::max(1,len(records)//16)][:16]
          endings=Counter()
          for row in records:
              address=row.get('address','').strip()
              if not address:continue
              sep=address.split(',')[-1].strip()
              endings['contains_comma' if ',' in address else 'no_comma']+=1
              endings['ends_explicit_iso_country' if country_from_explicit_address(address) else 'unresolved_suffix']+=1
              endings['ends_numeral' if address[-1].isdigit() else 'ends_non_numeral']+=1
          print('Published FDA DECRS address shape counts:',dict(endings))
          for row in sample:
              # Published establishment address only; source contact fields never exported.
              print('FDA DECRS PUBLIC ADDRESS SAMPLE:',repr(row.get('address','')[:180]))
          PY
      - name: Refresh official Ireland EPA licence profiles
        run: python scripts/build_ireland_leap.py --output web/registry/ireland-leap.json
      - name: Validate published facility catalog
        run: |
          python - <<'PY'
          import json
          from facilityrisk.registry_catalog import validate_catalog
          d=validate_catalog(json.load(open('web/registry/catalog.json',encoding='utf-8')))
          assert len(d['rows'])>1000, 'Unexpectedly small catalog; refusing deployment'
          assert d['sources']['fda_device']['status']=='imported'
          print('Public registered source entities:',len(d['rows']))
          print('Drug coverage:',d['sources'].get('fda_drug'))
          pharma=d['summary']['field_coverage_by_sector'].get('Pharmaceutical',{})
          assert pharma.get('with_source_country_field',0)+pharma.get('with_explicit_address_country',0) <= pharma.get('with_structured_country',0)
          print('Drug ISO country sources:',{k:pharma.get(k,0) for k in ('with_structured_country','with_source_country_field','with_explicit_address_country')})
          ireland=validate_catalog(json.load(open('web/registry/ireland-leap.json',encoding='utf-8')))
          assert len(ireland['rows']) >= 1000,'Unexpectedly small Ireland EPA catalog'
          assert ireland['sources']['ireland_leap']['status']=='imported'
          assert all(x[ireland['fields'].index('country')]=='IE' for x in ireland['rows'])
          print('Irish EPA licence profile identities:',len(ireland['rows']))
          PY
      - name: Publish non-personal establishment catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/registry/catalog.json web/registry/ireland-leap.json
          if git diff --cached --quiet; then echo 'No catalog changes'; exit 0; fi
          git commit -m 'Data: refresh FDA facility registration search catalog [skip ci]'
          git push origin HEAD:main