name: Lane A - official FEMA national REST count and WFS availability diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - ingest/fema-wildfire-lane-a-20261023
    paths:
      - 'scripts/lane_a_fema_distribution.py'
      - 'tests/test_lane_a_fema_distribution.py'
      - '.github/workflows/lane-a-fema-distribution.yml'
permissions:
  contents: read
jobs:
  official-nfhl-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert count metadata and WFS do not imply real polygon downloads
        run: python -m unittest discover -s tests -p 'test_lane_a_fema_distribution.py' -v
      - name: Request national official FEMA REST feature count and OGC WFS Capabilities
        run: python -m scripts.lane_a_fema_distribution --out-dir data/lane_a/fema_distribution
      - name: Preserve official national status receipts and honest errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-a-official-fema-national-distribution-probe
          path: |
            data/lane_a/fema_distribution/
          retention-days: 7
          if-no-files-found: warn
