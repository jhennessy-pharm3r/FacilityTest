name: FDA DECRS official download diagnostic
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 6'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_decrs.py'
      - '.github/workflows/probe-decrs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect FDA landing-page link, headers and ZIP magic
        run: python -m scripts.probe_decrs --output decrs-access-report.json
      - name: Publish endpoint diagnostics, not client records
        uses: actions/upload-artifact@v4
        with:
          name: fda-decrs-access-diagnostic
          path: decrs-access-report.json
          retention-days: 30
