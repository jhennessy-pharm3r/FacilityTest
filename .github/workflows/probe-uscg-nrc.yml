name: Probe official USCG NRC annual FOIA workbooks
on:
  workflow_dispatch:
  schedule:
    - cron: '22 7 1 * *'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_uscg_nrc.py'
      - '.github/workflows/probe-uscg-nrc.yml'
permissions:
  contents: read
concurrency:
  group: nrc-official-workbook-schema-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel reader and HTTP client
        run: python -m pip install 'openpyxl>=3.1,<4' 'requests>=2.32,<3'
      - name: Inspect real NRC 2025 complete-year workbook
        run: |
          python scripts/probe_uscg_nrc.py \
            --year 2025 --output data/nrc/CY25.xlsx \
            --report data/nrc/CY25-probe.json
      - name: Inspect real NRC 2026 current-year workbook
        run: |
          python scripts/probe_uscg_nrc.py \
            --year 2026 --output data/nrc/CY26.xlsx \
            --report data/nrc/CY26-probe.json
      - name: Confirm two distinct upstream years and complete metadata
        run: |
          python - <<'PY'
          import json
          a=json.load(open('data/nrc/CY25-probe.json'))
          b=json.load(open('data/nrc/CY26-probe.json'))
          for r in (a,b):
              assert r['state']=='schema_probe_only_not_imported'
              assert r['recognizable_headers']>=1
              assert len(r['sha256'])==64 and r['archive_bytes']>4096
              assert len(r['worksheets'])>=2
          assert a['year']==2025 and b['year']==2026
          print('NRC annual workbooks accessible and independently schema-probed, NOT imported')
          PY
      - name: Archive untouched official NRC workbooks and table-layout QA privately
        uses: actions/upload-artifact@v4
        with:
          name: uscg-nrc-source-only-workbook-probe
          path: |
            data/nrc/CY25.xlsx
            data/nrc/CY26.xlsx
            data/nrc/CY25-probe.json
            data/nrc/CY26-probe.json
          retention-days: 7
          compression-level: 4
          if-no-files-found: error
