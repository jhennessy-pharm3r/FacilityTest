name: Public source connectivity check
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '31 9 * * 1' # weekly UTC; connectivity only, not a data refresh
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe public endpoint reachability, not facility results
        env:
          FACILITY_RISK_DB: ${{ runner.temp }}/source-health.sqlite
        shell: bash
        run: |
          python -m facilityrisk probe-sources > source-health-report.json
          python -m facilityrisk probe-extended-sources > extended-source-report.json
          python - <<'PY'
          import json
          data=json.load(open('source-health-report.json'))
          for row in data['checks']:
              print(f"{row['source']}: {row['state']} ({row['details'][:100]})")
          assert len(data['checks']) >= 6
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-connection-status
          path: |
            source-health-report.json
            extended-source-report.json
          retention-days: 14
