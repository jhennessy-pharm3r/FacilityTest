name: Lane D - Oak Ridge official public county outage source probe

on:
  push:
    branches:
      - ingest/eia861-utility-bi-lane-d-20261023
    paths:
      - .github/workflows/lane-d-odin-public-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-odin-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe only publicly documented public energy source endpoints
        shell: bash
        run: |
          mkdir -p /tmp/lane-d/odin
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from xml.etree import ElementTree
          import hashlib,json,pathlib
          endpoints = [
            "https://odin.ornl.gov/odi/status",
            "https://odin.ornl.gov/v3/api-docs",
            "https://openenergyhub.ornl.gov/api/explore/v2.1/catalog/datasets/odin-real-time-outages-county/records?limit=5",
            "https://openenergyhub.ornl.gov/api/explore/v2.1/catalog/datasets/eaglei_outages_2014/records?limit=5",
            "https://data.openei.org/files/6458/Outage_Dataset_R1.zip"
          ]
          receipts=[]
          for url in endpoints:
              rec={"url":url}
              try:
                  headers={"User-Agent":"FacilityRiskLaneD/1.0 (official public metadata probe)"}
                  if url.endswith(".zip"):
                      headers["Range"]="bytes=0-4095"
                  with urlopen(Request(url,headers=headers),timeout=40) as response:
                      data=response.read(2_000_001)
                      rec["status"]=response.status
                      rec["content_type"]=response.headers.get("Content-Type","")
                      rec["content_length_header"]=response.headers.get("Content-Length","")
                      rec["content_range"]=response.headers.get("Content-Range","")
                      rec["fetched_byte_count"]=len(data)
                      rec["sample_sha256"]=hashlib.sha256(data).hexdigest()
                      rec["final_host"]=response.geturl().split("/")[2]
                  if b"xml" in rec.get("content_type","").lower().encode() or data.lstrip().startswith(b"<?xml"):
                      root=ElementTree.fromstring(data)
                      rec["root_xml_tag"]=root.tag.rsplit("}",1)[-1]
                      rec["children_tags"]=dict(Counter(c.tag.rsplit("}",1)[-1] for c in root))
                      rec["depth_two_names"]=[(c.tag.rsplit("}",1)[-1], [j.tag.rsplit("}",1)[-1] for j in list(c)[:12]]) for c in list(root)[:5]]
                  elif rec.get("content_type","").startswith("application/json"):
                      obj=json.loads(data)
                      rec["json_top_level"]=list(obj)[:30] if isinstance(obj,dict) else type(obj).__name__
                      if isinstance(obj,dict) and isinstance(obj.get("paths"),dict):
                          rec["public_paths"]=list(obj["paths"])[:120]
                      if isinstance(obj,dict) and isinstance(obj.get("results"),list):
                          rec["records_in_response"]=len(obj["results"])
                          rec["record_field_names"]=list(obj["results"][0].keys()) if obj["results"] else []
              except (HTTPError,URLError,TimeoutError,ElementTree.ParseError,ValueError) as e:
                  rec["status"]=getattr(e,"code","TRANSPORT_OR_SCHEMA_FAILURE")
                  rec["error_type"]=type(e).__name__
                  rec["description"]=str(e)[:180]
              receipts.append(rec)
              print(json.dumps(rec)[:4500])
          out={"source":"DOE_ORNL_PUBLIC_OUTAGE_API_PROBE","checked_utc":datetime.now(timezone.utc).isoformat(),
               "observations":receipts,
               "real_source_rows_normalized":0,"source_rows_indexed":0,"deployed":0,
               "note":"Probe status/schema only; no records automatically accepted. Authenticated ODIN endpoints not accessed."}
          pathlib.Path("/tmp/lane-d/odin/manifest.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Publish ODIN public access status / schema only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-ornl-public-outage-schema-probe
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/lane-d/odin/manifest.json
