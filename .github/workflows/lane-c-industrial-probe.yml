name: Lane C official incident source probe
on:
  push:
    branches:
      - 'ingest/industrial-events-nrc-csb-phmsa-*'
  workflow_dispatch:
jobs:
  live-official-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt openpyxl requests
      - name: Check official NRC workbook + CSB release file + PHMSA pipeline ZIP
        shell: bash
        run: |
          mkdir -p output
          python scripts/probe_lane_c_sources.py --output output
      - name: Test importer fixture QA
        run: |
          pip install -r requirements-dev.txt
          pytest -q tests/test_industrial_incidents.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-c-source-probe
          path: output/
          retention-days: 14
