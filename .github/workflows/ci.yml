name: Facility Risk CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure private analyst data was not committed
        shell: bash
        run: |
          python - <<'PY'
          import subprocess,sys
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          allowed={'web/public-demo.json','web/case-studies.json','web/registry/catalog.json','web/registry/ireland-leap.json','web/registry/canada-npri.json'}
          bad=[x for x in paths if x.startswith('data/') or x.lower().endswith(('.sqlite','.sqlite3','.xlsx','.xls','.csv','.csv.gz','.db')) or (x.endswith('.json') and x not in allowed)]
          if bad:
              print('Restricted data/source files tracked: '+', '.join(bad));sys.exit(1)
          print(f'Scanned {len(paths)} tracked files; no restricted data files')
          PY
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: JavaScript syntax for private and public viewers
        run: |
          node --check web/app.js
          node --check web/universal-ui.js
          node --check web/insurance-ui.js
          node --check web/registry-ui.js
          node --check web/intelligence-ui.js
          node --check web/public-api.js
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax tests
        run: |
          node --check web/app.js
          node --check web/public-api.js
          node --check web/intelligence-ui.js
          node --check web/registry-ui.js
      - name: Public case-study schema check
        run: python -m json.tool web/case-studies.json > /dev/null