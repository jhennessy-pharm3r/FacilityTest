name: Lane D - Official PNNL historical county outage ingestion

on:
  push:
    branches:
      - ingest/eia861-utility-bi-lane-d-20261023
    paths:
      - facilityrisk/lane_d/ingest_pnnl_county_outages.py
      - tests/test_lane_d_pnnl_county_outages.py
      - facilityrisk/lane_d/query_staging.py
      - tests/test_lane_d_query_staging.py
      - .github/workflows/lane-d-pnnl-county-outage-ingestion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-pnnl-full-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run five source-family, native identifier and malformed-row tests
        run: python -m unittest discover -s tests -p test_lane_d_pnnl_county_outages.py -v
      - name: Download official PNNL DOE historical nationwide outage study
        shell: bash
        run: |
          mkdir -p /tmp/lane-d/pnnl
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 360 \
            --user-agent 'FacilityTest Lane D official DOE data ingestion' \
            'https://data.openei.org/files/6458/Outage_Dataset_R1.zip' \
            --output /tmp/lane-d/pnnl/Outage_Dataset_R1.zip
      - name: Normalize and index all actual 2014-2023 PNNL source families
        run: |
          python -m facilityrisk.lane_d.ingest_pnnl_county_outages \
            --zip /tmp/lane-d/pnnl/Outage_Dataset_R1.zip \
            --output /tmp/lane-d/pnnl/staged
      - name: Independent original member row recount and SQLite query verification
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,pathlib,sqlite3,zipfile
          root=pathlib.Path("/tmp/lane-d/pnnl")
          archive=root/"Outage_Dataset_R1.zip"
          m=json.loads((root/"staged"/"manifest.json").read_text())
          h=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert m["archive_sha256"]==h
          assert m["archive_bytes"]==archive.stat().st_size==31260449, "Published archive changed: review before baselining"
          assert m["published_csv_members"]==50
          scanned=0
          with zipfile.ZipFile(archive) as source:
              for entry in m["source_members"]:
                  data=source.read(entry["source_member"])
                  assert hashlib.sha256(data).hexdigest()==entry["member_sha256"]
                  rows=sum(1 for row in csv.reader(io.StringIO(data.decode("utf-8-sig"))))-1
                  assert rows==entry["source_rows_scanned"]==entry["accepted"]+entry["rejected"]
                  scanned+=rows
          assert scanned==m["source_rows_scanned"]==m["accepted"]+m["rejected"]
          assert m["accepted"]>0 and m["locally_indexed"]==m["accepted"]
          assert m["durable_backend_indexed"]==m["deployed"]==m["verified_insured_facility_outages"]==0
          with sqlite3.connect(root/"staged"/"pnnl_county_outage_staging.sqlite") as db:
              assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert db.execute("SELECT COUNT(*) FROM source_observations").fetchone()[0]==m["accepted"]
              actual=dict(db.execute("SELECT source_kind,COUNT(*) FROM source_observations GROUP BY source_kind"))
              assert actual==m["accepted_by_source_kind"]
              example=db.execute("SELECT county_fips,dataset_year,source_kind,COUNT(*) FROM source_observations WHERE county_fips IS NOT NULL GROUP BY county_fips,dataset_year,source_kind LIMIT 10").fetchall()
              assert example and all(len(e[0])==5 for e in example)
          print("PNNL independent original CSV scan:",scanned,"accepted:",m["accepted"],
                "rejected:",m["rejected"],"staged SQLite:",m["locally_indexed"])
          print("PNNL kinds:",json.dumps(m["accepted_by_source_kind"]))
          print("PNNL year coverage:",m["source_coverage_years"],"states:",m["distinct_state_names"],
                "unique county FIPS:",m["unique_county_fips"])
          PY
      - name: Verify read-only county-level context query on actual PNNL staging index
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,sqlite3
          from facilityrisk.lane_d.query_staging import get_county_context
          db=pathlib.Path("/tmp/lane-d/pnnl/staged/pnnl_county_outage_staging.sqlite")
          with sqlite3.connect(db) as con:
              county=con.execute("""SELECT county_fips,COUNT(*) FROM source_observations
                WHERE county_fips IS NOT NULL AND source_kind='county_episode'
                GROUP BY county_fips ORDER BY COUNT(*) DESC LIMIT 1""").fetchone()
          assert county and len(county[0])==5
          result=get_county_context(county[0],pnnl_db=db,limit=5)
          assert result["candidate_counts"]["pnnl_historical_county_episodes"]==county[1]
          assert 1<=len(result["returned_findings"])<=5
          assert all(r["category"]=="HISTORICAL_COUNTY_OUTAGE_EPISODE" for r in result["returned_findings"])
          assert all(r["insured_facility_outage_verified"] is False for r in result["returned_findings"])
          assert result["verified_business_interruption_claims"]==0
          print("Read-only FIPS county query passed", county[0], "source rows", county[1],
                "returned",len(result["returned_findings"]))
          PY
      - name: Publish provenance and source QA ledger only; source CSV data remain in isolated runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-d-doe-pnnl-2014-2023-outages-manifest
          retention-days: 7
          if-no-files-found: warn
          path: /tmp/lane-d/pnnl/staged/manifest.json
