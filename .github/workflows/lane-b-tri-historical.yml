name: Lane B EPA TRI historical US 1987-2019 official full-year ingestion
on:
  push:
    branches: ['ingest/epa-echo-tri-rcra-rmp-lane-b-20261023']
    paths: ['.github/workflows/lane-b-tri-historical.yml']
  workflow_dispatch:
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire authentic complete EPA TRI national historical reporting year
        run: |
          python - <<'PY'
          import csv,os,pathlib,shutil,urllib.request
          year=os.environ['YEAR']
          url=f'https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/{year}_US/csv'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('tri_'+year)
          root.mkdir(parents=True,exist_ok=True)
          path=root/('tri_'+year+'_US.csv')
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'FacilityRisk-LaneB/1.0'}),timeout=150) as r,path.open('wb') as dest:
              shutil.copyfileobj(r,dest)
          with path.open(encoding='utf-8-sig',errors='replace',newline='') as f:
              columns=next(csv.reader(f))
          assert '2. TRIFD' in columns and '1. YEAR' in columns and '50. UNIT OF MEASURE' in columns
          print('OFFICIAL_TRI_SOURCE',year,url,'ORIGINAL_BYTES',path.stat().st_size,
                'FIELD_COUNT',len(columns))
          PY
      - name: Normalize all official records with native IDs and retain original reporting unit
        run: |
          set -euo pipefail
          year="$YEAR"
          root="$RUNNER_TEMP/tri_$year"
          url="https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/${year}_US/csv"
          python -m scripts.lane_b_epa.ingest --source tri --year "$year" --input "$root/tri_${year}_US.csv" --url "$url" --output "$root/index" > "$root/source_import.json"
          python - <<'PY'
          import hashlib,json,os,pathlib,sqlite3
          from scripts.lane_b_epa.read_index import source_status,lookup
          year=os.environ['YEAR']
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('tri_'+year)
          meta=root/'index'/'tri.manifest.json'
          db=root/'index'/'tri.sqlite'
          m=json.loads(meta.read_text())
          facts=source_status(db,meta,'tri')
          with sqlite3.connect(db) as con:
              cnt=con.execute("SELECT COUNT(*) FROM observation").fetchone()[0]
              distinct=con.execute("SELECT COUNT(DISTINCT source_id) FROM observation").fetchone()[0]
              year_values=con.execute("SELECT json_extract(payload,'$.1_YEAR') AS yr, COUNT(*) FROM observation GROUP BY 1").fetchall()
              units=con.execute("SELECT COALESCE(json_extract(payload,'$.50_UNIT_OF_MEASURE'),'<null>'), COUNT(*) FROM observation GROUP BY 1").fetchall()
              example=con.execute("SELECT source_id FROM observation LIMIT 1").fetchone()[0]
              chem=con.execute("SELECT COUNT(DISTINCT json_extract(payload,'$.39_TRI_CHEMICAL_COMPOUND_ID')) FROM observation").fetchone()[0]
              rejects=con.execute("SELECT reason,COUNT(*) FROM rejected GROUP BY 1").fetchall()
          assert cnt>0 and cnt==m['indexed_rows']==facts['indexed_rows']
          assert cnt + m['rejected_rows']==m['scanned_rows']
          assert year_values==[(year,cnt)],('YEAR_MISMATCH',year,year_values)
          response=lookup(db,meta,'tri',example,limit=2)
          assert response['observations_available']>0
          assert response['rows'][0]['source_reported_findings']['reporting_year']==year
          audit={'reporting_year':int(year),'scanned_downloaded_rows':m['scanned_rows'],
              'accepted_normalized':m['accepted_rows'],'source_indexed':cnt,
              'rejected':m['rejected_rows'],'reject_reasons':dict(rejects),
              'distinct_native_TRI_facility_ids':distinct,'distinct_chemical_codes':chem,
              'source_reported_units':dict(units),
              'coordinate_pairs':m['valid_coordinate_pairs'],
              'original_source_bytes':(root/('tri_'+year+'_US.csv')).stat().st_size,
              'source_sha256':m['archive_sha256'],'index_sha256':m['index_sha256'],
              'source_last_report_year':year,'deployed_records':0,
              'limitations':'Annual chemical form rows; historic program scope and reporting thresholds change; not physical properties/loss claims.'}
          (root/'index'/'year_qa.json').write_text(json.dumps(audit,indent=2)+'\n')
          print('VERIFIED_HISTORICAL_TRI_COHORT',json.dumps(audit,sort_keys=True))
          PY
      - name: Compress original normalized source-only index for handoff
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tri_$YEAR"
          gzip -1 -n -c "$root/index/tri.sqlite" > "$root/index/tri.sqlite.gz"
          du -h "$root/tri_${YEAR}_US.csv" "$root/index/tri.sqlite.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-b-tri-historical-${{ matrix.year }}-qa
          path: |
            ${{ runner.temp }}/tri_${{ matrix.year }}/index/tri.manifest.json
            ${{ runner.temp }}/tri_${{ matrix.year }}/index/year_qa.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lane-b-tri-historical-${{ matrix.year }}-source-index
          path: |
            ${{ runner.temp }}/tri_${{ matrix.year }}/tri_${{ matrix.year }}_US.csv
            ${{ runner.temp }}/tri_${{ matrix.year }}/index/tri.sqlite.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
