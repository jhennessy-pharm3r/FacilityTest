name: Coordinator Lane A private API - real official source release QA
on:
  workflow_dispatch:
  push:
    branches:
      - integrate/lane-a-private-api-20261023
    paths:
      - 'facilityrisk/lane_a_service.py'
      - 'facilityrisk/app.py'
      - 'facilityrisk/source_sidecars.py'
      - 'tests/test_lane_a_private_api.py'
      - 'scripts/smoke_lane_a_private_api.py'
      - '.github/workflows/lane-a-private-api-qa.yml'
permissions:
  contents: read
  actions: read
jobs:
  real-official-source-private-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact app and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate fail-closed source mounting, client auth and stored site coordinate review
        run: python -m pytest -q tests/test_lane_a_private_api.py
      - name: Download previously verified ORIGINAL FEMA and USDA immutable source-only release
        uses: actions/download-artifact@v4
        with:
          name: lane-a-verified-installed-source-release-qa
          run-id: 40001237902
          github-token: ${{ github.token }}
          path: staged-real-release
      - name: Query real installed publisher data through authenticated FastAPI / Source Health
        env:
          FACILITY_RISK_REQUIRE_AUTH: "1"
          FACILITY_RISK_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FACILITY_RISK_DB: ${{ runner.temp }}/private-lane-a-api-fixture.sqlite
        run: |
          export FACILITY_RISK_LANE_A_INDEX_ROOT="$PWD/staged-real-release/_temp/facility-lane-a-installed"
          test -f "$FACILITY_RISK_LANE_A_INDEX_ROOT/current.json"
          python -m scripts.smoke_lane_a_private_api | tee lane-a-private-api-real-data-qa.log
      - name: Archive authenticated API evidence and explicit no-deployment scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-a-private-api-actual-source-query-qa
          path: |
            lane-a-private-api-real-data-qa.log
          retention-days: 7
          if-no-files-found: warn
