name: Publish public source health ledger
on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'
permissions:
  contents: write
concurrency:
  group: publish-public-source-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Probe official public endpoints and document-only extended sources
        env:
          FACILITY_RISK_DB: ${{ runner.temp }}/source-health.sqlite
        run: |
          python -m facilityrisk probe-sources > source-health-report.json
          python -m facilityrisk probe-extended-sources > extended-source-report.json
      - name: Publish sanitized probe and catalog-ingestion summary
        run: |
          python scripts/publish_source_status.py --output web/source-status.json
          python -m json.tool web/source-status.json > /dev/null
      - name: Commit source status only (no private findings)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/source-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Data: publish public source health and identity ingestion states [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-health-validation-raw
          path: |
            source-health-report.json
            extended-source-report.json
            web/source-status.json
          if-no-files-found: ignore
          retention-days: 14
