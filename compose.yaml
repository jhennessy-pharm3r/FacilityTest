services:
  facility-risk:
    build: .
    image: pharm3r/facility-risk:local
    environment:
      FACILITY_RISK_DB: /app/data/facility_risk.sqlite
      FACILITY_RISK_REQUIRE_AUTH: "1"
      FACILITY_RISK_AUTH_TOKEN: ${FACILITY_RISK_AUTH_TOKEN:?Set an unpredictable 32-plus-character token in your untracked .env}
      FACILITY_RISK_BASIC_USER: ${FACILITY_RISK_BASIC_USER:-analyst}
      FACILITY_RISK_ENABLE_WRITES: "0"
      # Read-only, independently validated public-authority source databases.
      # Absent variables mean no mounted national index; never silently assume all facilities.
      FACILITY_RISK_FRS_INDEX_PATH: ${FACILITY_RISK_FRS_INDEX_PATH:-}
      FACILITY_RISK_FRS_INDEX_QA: ${FACILITY_RISK_FRS_INDEX_QA:-}
      FACILITY_RISK_NOAA_INDEX_PATH: ${FACILITY_RISK_NOAA_INDEX_PATH:-}
      FACILITY_RISK_NOAA_INDEX_MANIFEST: ${FACILITY_RISK_NOAA_INDEX_MANIFEST:-}
      FACILITY_RISK_INCIDENTNEWS_INDEX_PATH: ${FACILITY_RISK_INCIDENTNEWS_INDEX_PATH:-}
      FACILITY_RISK_INCIDENTNEWS_INDEX_MANIFEST: ${FACILITY_RISK_INCIDENTNEWS_INDEX_MANIFEST:-}
      # Only an independently verified, installed immutable Lane A release; never a CI artifact path.
      FACILITY_RISK_LANE_A_INDEX_ROOT: ${FACILITY_RISK_LANE_A_INDEX_ROOT:-}
      # Optional verified EPA Lane B source-only indexes; read-only mount below.
      # Routes are disabled until explicitly enabled after private hosting/auth review.
      FACILITY_RISK_LANE_B_ROUTES_ENABLED: ${FACILITY_RISK_LANE_B_ROUTES_ENABLED:-0}
      FACILITY_RISK_LANE_B_ECHO_DIRECTORY: ${FACILITY_RISK_LANE_B_ECHO_DIRECTORY:-}
      FACILITY_RISK_LANE_B_RCRA_DIRECTORY: ${FACILITY_RISK_LANE_B_RCRA_DIRECTORY:-}
      FACILITY_RISK_LANE_B_TRI_ROOT: ${FACILITY_RISK_LANE_B_TRI_ROOT:-}
      FACILITY_RISK_LANE_B_TRI_YEARS: ${FACILITY_RISK_LANE_B_TRI_YEARS:-}
      FACILITY_RISK_LANE_B_RMP_DIRECTORY: ${FACILITY_RISK_LANE_B_RMP_DIRECTORY:-}
      # Read-only index roots; ORNL current county serving denied until publisher rights approval.
      FACILITY_RISK_LANE_D_INDEX_ROOT: ${FACILITY_RISK_LANE_D_INDEX_ROOT:-}
      FACILITY_RISK_LANE_D_ODIN_USE_APPROVED: ${FACILITY_RISK_LANE_D_ODIN_USE_APPROVED:-0}
    ports:
      # Do not bind to 0.0.0.0; use a TLS + OIDC reverse proxy for remote access.
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
      # Indexes are immutable, source-only, and separate from the client workspace.
      - ./source-index:/app/source-index:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
